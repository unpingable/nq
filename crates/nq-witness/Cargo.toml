[package]
name = "nq-witness"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Versioned witness artifacts, validation, identity, and projection adoption for NQ"
license = "Apache-2.0"
repository = "https://github.com/unpingable/nq"
readme = "README.md"

[dependencies]
nq-protocol = { version = "0.1.0", path = "../nq-protocol" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
