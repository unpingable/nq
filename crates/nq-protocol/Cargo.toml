[package]
name = "nq-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Small, versioned wire primitives shared by the NQ constellation"
license = "Apache-2.0"
repository = "https://github.com/unpingable/nq"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
